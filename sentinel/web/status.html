<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="build" content="status-v10">
<title>服务状态 - SiteSentry</title>
<link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
<style>
  :root {
    --bg: #f3f5f9;
    --card: #ffffff;
    --ink: #1e293b;
    --ink-2: #64748b;
    --ink-3: #94a3b8;
    --line: #e2e8f0;
    --primary: #2563eb;
    --ok: #16a34a;
    --ok-bg: #dcfce7;
    --down: #dc2626;
    --down-bg: #fee2e2;
    --warn: #d97706;
    --warn-bg: #fef3c7;
    --side: #0f172a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1100px 420px at 50% -140px, rgba(37, 99, 235, .07), transparent 70%),
      var(--bg);
    color: var(--ink); line-height: 1.6;
  }
  ::selection { background: rgba(37, 99, 235, .18); }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .hd {
    position: relative; color: #fff; padding: 34px 20px 70px;
    background:
      radial-gradient(820px 300px at 12% -60%, rgba(59, 130, 246, .30), transparent 62%),
      radial-gradient(640px 260px at 92% -40%, rgba(16, 185, 129, .16), transparent 60%),
      linear-gradient(135deg, #0b1220 0%, #152238 100%);
  }
  .hd::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 36px 36px;
    -webkit-mask-image: radial-gradient(ellipse 90% 120% at 50% 0%, #000 30%, transparent 78%);
    mask-image: radial-gradient(ellipse 90% 120% at 50% 0%, #000 30%, transparent 78%);
  }
  .hd-inner { max-width: 960px; margin: 0 auto; position: relative; }
  .hd-top { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
  .logo {
    width: 48px; height: 48px; border-radius: 14px; flex: none;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fff; box-shadow: 0 8px 22px rgba(37, 99, 235, .5);
  }
  .hd h1 { font-size: 24px; font-weight: 800; letter-spacing: .5px; }
  .hd .sub { color: #94a3b8; font-size: 13px; margin-top: 2px; }
  .hd-meta { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
  .overall {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 9px 18px; border-radius: 999px; font-size: 14.5px; font-weight: 700;
    border: 1px solid transparent;
  }
  .overall.ok { background: rgba(22, 163, 74, .16); color: #4ade80; border-color: rgba(74, 222, 128, .38); box-shadow: 0 0 26px rgba(34, 197, 94, .28); }
  .overall.bad { background: rgba(220, 38, 38, .16); color: #fca5a5; border-color: rgba(252, 165, 165, .38); box-shadow: 0 0 26px rgba(239, 68, 68, .25); }
  .overall .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .hd-uptime { color: #93c5fd; font-size: 12.5px; font-weight: 600; letter-spacing: .2px; }
  .updated { color: #64748b; font-size: 12px; margin-top: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .main { max-width: 960px; margin: -40px auto 40px; padding: 0 20px; }
  .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 22px; }
  .card {
    background: var(--card); border: 1px solid #e8edf4; border-radius: 14px; padding: 16px 18px 14px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 4px 16px rgba(15, 23, 42, .04);
    transition: transform .18s, box-shadow .18s, border-color .18s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(15, 23, 42, .09); }
  .card.c-total:hover { border-color: #bfdbfe; }
  .card.c-up:hover { border-color: #bbf7d0; }
  .card.c-down:hover { border-color: #fecaca; }
  .card.c-maint:hover { border-color: #dbe2ea; }
  .card.c-open:hover { border-color: #fde68a; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .card { animation: fadeUp .45s ease both; }
  .card:nth-child(2) { animation-delay: .05s; } .card:nth-child(3) { animation-delay: .1s; }
  .card:nth-child(4) { animation-delay: .15s; } .card:nth-child(5) { animation-delay: .2s; }
  .sec { animation: fadeUp .5s ease both; animation-delay: .25s; }
  .c-ico {
    width: 36px; height: 36px; border-radius: 10px; margin-bottom: 10px; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .c-total .c-ico { background: linear-gradient(135deg, #60a5fa, #2563eb); box-shadow: 0 4px 10px rgba(37, 99, 235, .28); }
  .c-up .c-ico { background: linear-gradient(135deg, #4ade80, #16a34a); box-shadow: 0 4px 10px rgba(22, 163, 74, .28); }
  .c-down .c-ico { background: linear-gradient(135deg, #f87171, #dc2626); box-shadow: 0 4px 10px rgba(220, 38, 38, .26); }
  .c-maint .c-ico { background: linear-gradient(135deg, #94a3b8, #64748b); box-shadow: 0 4px 10px rgba(100, 116, 139, .26); }
  .c-open .c-ico { background: linear-gradient(135deg, #fbbf24, #d97706); box-shadow: 0 4px 10px rgba(217, 119, 6, .28); }
  .c-val { font-size: 28px; font-weight: 800; line-height: 1.15; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .c-l { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; font-weight: 500; }
  .c-up .c-val { color: var(--ok); }
  .c-maint .c-val { color: #475569; }
  .c-val.danger { color: var(--down) !important; }

  .sec {
    background: var(--card); border-radius: 12px; margin-bottom: 22px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 4px 16px rgba(15, 23, 42, .04);
    overflow: hidden;
  }
  .sec-hd {
    display: flex; align-items: center; gap: 10px; padding: 16px 20px;
    border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 700;
  }
  .sec-hd i { color: var(--primary); }
  .s-ico {
    width: 30px; height: 30px; border-radius: 9px; background: #eff6ff; color: var(--primary);
    display: inline-flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .sec-count {
    margin-left: auto; background: #eff6ff; color: #2563eb;
    font-size: 12px; font-weight: 700; padding: 2px 11px; border-radius: 999px;
  }
  .tgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 16px; }
  .tcell { display: flex; flex-direction: column; min-width: 0; }
  .tcard {
    position: relative; overflow: hidden; background: #fff; min-width: 0;
    border: 1px solid #e8edf4; border-radius: 14px; padding: 15px 16px 13px;
    cursor: pointer; transition: transform .18s, box-shadow .18s, border-color .18s;
  }
  .tcard::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--ok); }
  .tcard.down { background: #fffafa; border-color: #fecaca; }
  .tcard.down::before { background: var(--down); }
  .tcard.maint::before { background: #94a3b8; }
  .tcard.other::before { background: var(--line); }
  .tcard:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(15, 23, 42, .08); }
  .tcard.up:hover { border-color: #bbf7d0; }
  .tcard.down:hover { border-color: #fca5a5; }
  .tcard.maint:hover { border-color: #dbe2ea; }
  .tcard-head { display: flex; align-items: center; gap: 12px; }
  .tcard .ticon {
    width: 42px; height: 42px; border-radius: 12px; flex: none;
    background: #f1f5f9; display: flex; align-items: center; justify-content: center;
    overflow: hidden; color: var(--ink-3); font-size: 18px;
  }
  .tcard .ticon img { width: 26px; height: 26px; object-fit: contain; }
  .tcard-id { flex: 1; min-width: 0; }
  .tcard-name { font-weight: 700; font-size: 15px; line-height: 1.35; }
  .s-chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1.5px 9px; border-radius: 999px; margin-left: 8px; vertical-align: 1.5px; }
  .s-chip.up { background: var(--ok-bg); color: var(--ok); }
  .s-chip.down { background: var(--down-bg); color: var(--down); }
  .s-chip.maint { background: #eef2f7; color: #475569; }
  .s-chip.other { background: #f1f5f9; color: #94a3b8; }
  .tcard-url { font-size: 12px; color: var(--ink-3); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tcard-ext {
    flex: none; color: var(--ink-3); font-size: 13px; padding: 7px; border-radius: 9px;
    transition: all .15s; text-decoration: none;
  }
  .tcard-ext:hover { color: var(--primary); background: #eff6ff; text-decoration: none; }
  .tcard .caret { color: var(--ink-3); font-size: 12px; transition: transform .2s; flex: none; padding: 7px 0; }
  .tcell.open .caret { transform: rotate(180deg); }
  .tcard-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #f1f5f9;
    color: var(--ink-2); white-space: nowrap;
  }
  .chip b { color: var(--ink); font-weight: 700; }
  .chip.good { background: var(--ok-bg); color: var(--ok); }
  .chip.good b { color: var(--ok); }
  .chip.bad { background: var(--down-bg); color: var(--down); }
  .chip.bad b { color: var(--down); }
  .tcard-detail {
    display: none; margin-top: 10px; min-width: 0; background: #fff;
    border: 1px dashed var(--line); border-radius: 12px; padding: 6px 16px 14px;
  }
  .tcell.open .tcard-detail { display: block; animation: fadeUp .3s ease both; }
  .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
  .dg { background: #f8fafc; border-radius: 10px; padding: 10px 14px; }
  .dg .l { font-size: 12px; color: var(--ink-2); }
  .dg .v { font-size: 18px; font-weight: 700; }
  .bars-title { font-size: 12px; color: var(--ink-2); margin: 10px 0 6px; }
  .bars { display: flex; align-items: flex-end; gap: 1px; height: 44px; overflow-x: auto; padding-bottom: 2px; }
  .bar { flex: none; width: 4px; height: 100%; border-radius: 1px; background: var(--ok); opacity: .85; }
  .bar.down { background: var(--down); }
  .bar.none { background: var(--line); }
  .bars-x { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-top: 4px; }
  .mini-inc { list-style: none; margin-top: 10px; }
  .mini-inc li { font-size: 13px; color: var(--ink-2); padding: 6px 0; border-top: 1px dashed var(--line); }
  .mini-inc li i { margin-right: 6px; }
  .loading { padding: 24px; text-align: center; color: var(--ink-3); font-size: 13px; }

  .inc { display: flex; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .inc:last-child { border-bottom: none; }
  .inc-line { flex: none; width: 12px; margin-top: 7px; }
  .inc-line .d { width: 12px; height: 12px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
  .inc-line.bad .d { background: var(--down); box-shadow: 0 0 0 3px var(--down-bg); }
  .inc-line.warn .d { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
  .inc-body { flex: 1; min-width: 0; }
  .inc-t { font-size: 14px; font-weight: 600; }
  .inc-m { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .inc-time { font-size: 12px; color: var(--ink-3); white-space: nowrap; margin-top: 4px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: 1px; }
  .badge.open { background: var(--down-bg); color: var(--down); }
  .badge.resolved { background: var(--ok-bg); color: var(--ok); }
  .badge.ignored { background: #f1f5f9; color: var(--ink-3); }
  .empty { padding: 28px; text-align: center; color: var(--ink-3); font-size: 13px; }
  .empty i { font-size: 22px; display: block; margin-bottom: 8px; color: var(--ink-3); }

  .ft { text-align: center; padding: 24px 20px 34px; color: var(--ink-3); font-size: 12px; }
  .ft a { color: var(--ink-2); }
  .ft i { margin-right: 4px; }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(3, 1fr); }
    .tgrid { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .hd { padding: 20px 14px 50px; }
    .hd h1 { font-size: 19px; }
    .overall { padding: 7px 13px; font-size: 12.5px; }
    .hd-uptime { font-size: 11.5px; }
    .updated { font-size: 11px; }
    .main { margin-top: -32px; padding: 0 12px; }
    .cards { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .cards .card:last-child { grid-column: span 2; }
    .card { padding: 13px 14px 11px; }
    .c-ico { width: 32px; height: 32px; font-size: 14px; border-radius: 9px; margin-bottom: 8px; }
    .c-val { font-size: 22px; }
    .c-l { font-size: 11.5px; }
    .sec-hd { padding: 13px 14px; font-size: 14px; }
    .s-ico { width: 26px; height: 26px; font-size: 12px; border-radius: 8px; }
    .tgrid { padding: 12px; gap: 10px; }
    .tcard { padding: 13px 13px 11px; }
    .tcard .ticon { width: 38px; height: 38px; font-size: 16px; border-radius: 10px; }
    .tcard .ticon img { width: 23px; height: 23px; }
    .tcard-name { font-size: 14px; }
    .tcard-stats { gap: 6px; margin-top: 10px; }
    .tcard-stats .chip { font-size: 11px; padding: 2px 8px; }
    .tcard-detail { padding: 4px 12px 12px; }
    .dg { padding: 8px 10px; }
    .dg .l { font-size: 11px; }
    .dg .v { font-size: 15px; }
    .inc { padding: 12px 14px; }
    .inc-time { display: none; }
    .ft { padding: 20px 14px 28px; }
  }
</style>
</head>
<body>

<div class="hd">
  <div class="hd-inner">
    <div class="hd-top">
      <div class="logo"><i class="fa-solid fa-shield-halved"></i></div>
      <div>
        <h1 id="appName">SiteSentry</h1>
        <div class="sub">实时服务状态</div>
      </div>
      <div class="hd-meta">
        <div id="overall" class="overall ok"><span class="dot"></span><span id="overallText">正在加载…</span></div>
        <div class="hd-uptime" id="hdUptime"></div>
      </div>
    </div>
    <div class="updated"><span id="updated">—</span></div>
  </div>
</div>

<div class="main">
  <div class="cards">
    <div class="card c-total"><span class="c-ico"><i class="fa-solid fa-globe"></i></span><div class="c-val" id="cTotal">-</div><div class="c-l">监控站点</div></div>
    <div class="card c-up"><span class="c-ico"><i class="fa-solid fa-circle-check"></i></span><div class="c-val" id="cUp">-</div><div class="c-l">在线</div></div>
    <div class="card c-down"><span class="c-ico"><i class="fa-solid fa-circle-xmark"></i></span><div class="c-val" id="cDown">-</div><div class="c-l">离线</div></div>
    <div class="card c-maint"><span class="c-ico"><i class="fa-solid fa-wrench"></i></span><div class="c-val" id="cMaint">-</div><div class="c-l">维护中</div></div>
    <div class="card c-open"><span class="c-ico"><i class="fa-solid fa-bell"></i></span><div class="c-val" id="cOpen">-</div><div class="c-l">未解决事件</div></div>
  </div>

  <div class="sec">
    <div class="sec-hd"><span class="s-ico"><i class="fa-solid fa-server"></i></span>监控目标<span class="sec-count" id="tCount"></span></div>
    <div class="tgrid" id="targets"><div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> 加载中…</div></div>
  </div>

  <div class="sec">
    <div class="sec-hd"><span class="s-ico"><i class="fa-solid fa-bell"></i></span>最近事件</div>
    <div id="incidents"><div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> 加载中…</div></div>
  </div>
</div>

<div class="ft">
  <i class="fa-solid fa-shield-halved"></i>Powered by <b>SiteSentry 哨兵</b> · 2026 · 每 60 秒自动刷新
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

const TYPE_LABEL = { check_down: '站点离线', check_recovery: '站点恢复', latency_spike: '响应变慢', log_burst: '日志激增', cert_expiring: '证书到期', reported: '上报异常' };
const SEV_LABEL = { critical: '严重', warning: '警告', info: '提示' };
const SEV_CLASS = { critical: 'bad', warning: 'warn', info: '' };

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function dur(fromIso, toIso) {
  if (!fromIso) return '';
  const a = new Date(fromIso).getTime();
  const b = toIso ? new Date(toIso).getTime() : Date.now();
  const m = Math.max(0, Math.round((b - a) / 60000));
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟';
  const h = Math.floor(m / 60);
  if (h < 48) return h + ' 小时 ' + (m % 60 ? (m % 60) + ' 分' : '');
  return Math.round(h / 24) + ' 天';
}
let lastRefresh = null;
// 单个可用率 chip：按阈值着色（≥99.5 绿 / ≥95 默认 / 其余红）
function upChip(label, v) {
  if (v == null) return `<span class="chip">${label} 暂无</span>`;
  const cls = v >= 99.5 ? 'good' : (v >= 95 ? '' : 'bad');
  return `<span class="chip ${cls}">${label} <b>${v}%</b></span>`;
}
// 图标加载失败回退：替换为通用地球图标
function iconErr(img) {
  img.outerHTML = '<i class="fa-solid fa-globe"></i>';
}
// 站点图标：经本服务 /api/public/icon 代理加载（规避目标站 CORP/防盗链），失败回退地球图标
function iconImg(icon) {
  if (!icon) return '<span class="ticon"><i class="fa-solid fa-globe"></i></span>';
  const src = '/api/public/icon?url=' + encodeURIComponent(icon);
  return `<span class="ticon"><img src="${src}" alt="" loading="lazy" onerror="iconErr(this)"></span>`;
}

let DATA = null;

async function load() {
  try {
    const r = await fetch('/api/public/status', { cache: 'no-store' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '请求失败');
    DATA = j.data;
    lastRefresh = new Date();
    render();
  } catch (e) {
    $('overallText').textContent = '状态获取失败';
    $('overall').className = 'overall bad';
    $('updated').textContent = '最近一次成功刷新: ' + (lastRefresh ? fmtTime(lastRefresh.toISOString()) : '—');
  }
}

function render() {
  const d = DATA;
  $('appName').textContent = d.app_name || 'SiteSentry';
  document.title = '服务状态 - ' + (d.app_name || 'SiteSentry');
  const okAll = d.overall === 'operational';
  $('overall').className = 'overall ' + (okAll ? 'ok' : 'bad');
  $('overallText').textContent = okAll ? '所有系统运行正常' : '部分服务异常';
  $('updated').textContent = '更新时间 ' + fmtTime(lastRefresh.toISOString()) + ' · 每 60 秒自动刷新';
  const s = d.summary;
  $('cTotal').textContent = s.targets_total;
  $('cUp').textContent = s.targets_up;
  $('cDown').textContent = s.targets_down;
  $('cMaint').textContent = s.targets_maint || 0;
  $('cOpen').textContent = s.open_incidents;
  $('cDown').classList.toggle('danger', s.targets_down > 0);
  $('cOpen').classList.toggle('danger', s.open_incidents > 0);
  $('tCount').textContent = d.targets.length;
  const u30 = d.targets.map(t => t.uptime_30d).filter(v => v != null);
  $('hdUptime').textContent = u30.length
    ? ('30 天平均可用率 ' + (Math.round(u30.reduce((a, b) => a + b, 0) / u30.length * 100) / 100) + '%')
    : '';

  // 目标列表
  if (!d.targets.length) {
    $('targets').innerHTML = '<div class="empty"><i class="fa-solid fa-inbox"></i>暂无公开的监控目标</div>';
  } else {
    const ST_CHIP = { up: '在线', down: '离线', maint: '维护中', other: '未检查' };
    $('targets').innerHTML = d.targets.map((t) => {
      const st = t.in_maintenance ? 'maint' : (t.status === 'up' ? 'up' : (t.status === 'down' ? 'down' : 'other'));
      return `<div class="tcell" data-id="${t.id}">
        <div class="tcard ${st}">
          <div class="tcard-head">
            ${iconImg(t.icon)}
            <div class="tcard-id">
              <div class="tcard-name">${esc(t.name)}<span class="s-chip ${st}">${ST_CHIP[st]}</span></div>
              <span class="tcard-url">${esc(t.url)}</span>
            </div>
            <a class="tcard-ext" href="${esc(t.url)}" target="_blank" rel="noopener" title="访问该网站" onclick="event.stopPropagation()"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
            <i class="fa-solid fa-chevron-down caret"></i>
          </div>
          <div class="tcard-stats">
            ${t.last_ms != null ? `<span class="chip"><b>${t.last_ms}</b> ms 响应</span>` : ''}
            ${upChip('24h', t.uptime_24h)}
            ${upChip('7d', t.uptime_7d)}
            ${upChip('30d', t.uptime_30d)}
          </div>
        </div>
        <div class="tcard-detail" data-detail><div class="loading">点击查看详情…</div></div>
      </div>`;
    }).join('');
    document.querySelectorAll('.tcell .tcard').forEach((el) => {
      el.addEventListener('click', () => onRowClick(el.closest('.tcell')));
    });
  }

  // 事件
  if (!d.incidents.length) {
    $('incidents').innerHTML = '<div class="empty"><i class="fa-regular fa-circle-check"></i>近期没有异常事件，一切顺利</div>';
  } else {
    $('incidents').innerHTML = d.incidents.map((a) => {
      const cls = a.type === 'check_down' ? 'bad' : (a.type === 'check_recovery' ? '' : (SEV_CLASS[a.severity] || 'warn'));
      const icon = a.type === 'check_recovery' ? 'fa-rotate-left' : (a.type === 'check_down' ? 'fa-triangle-exclamation' : 'fa-gauge-high');
      const durTxt = a.type === 'check_down' && a.resolved_at ? '（持续 ' + dur(a.created_at, a.resolved_at) + '）' : '';
      const stBadge = a.status === 'open' ? '<span class="badge open">未解决</span>' : (a.status === 'ignored' ? '<span class="badge ignored">已忽略</span>' : '<span class="badge resolved">已解决</span>');
      return `<div class="inc">
        <div class="inc-line ${cls}"><span class="d"></span></div>
        <div class="inc-body">
          <div class="inc-t"><i class="fa-solid ${icon}" style="margin-right:6px"></i>${esc(a.title)}${stBadge}</div>
          <div class="inc-m">${esc(TYPE_LABEL[a.type] || a.type)} · ${esc(a.target_name)} · ${SEV_LABEL[a.severity] || a.severity}${durTxt}</div>
        </div>
        <div class="inc-time">${fmtTime(a.created_at)}</div>
      </div>`;
    }).join('');
  }
}

async function onRowClick(row) {
  const box = row.querySelector('[data-detail]');
  if (!row.classList.contains('open')) {
    row.classList.add('open');
    if (!box.dataset.loaded) {
      box.innerHTML = '<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> 加载详情…</div>';
      try {
        const r = await fetch('/api/public/targets/' + row.dataset.id, { cache: 'no-store' });
        const j = await r.json();
        if (!j.ok) throw new Error(j.error || '加载失败');
        box.innerHTML = renderDetail(j.data);
        // 状态条默认滚到最新端（历史数据不足时左侧大片无数据灰色）
        const bars = box.querySelector('.bars');
        if (bars) bars.scrollLeft = bars.scrollWidth;
        box.dataset.loaded = '1';
      } catch (e) {
        box.innerHTML = '<div class="empty">详情加载失败：' + esc(e.message) + '</div>';
      }
    }
  } else {
    row.classList.remove('open');
  }
}

function renderDetail(t) {
  // 30 天小时条：完整时间轴，有数据的按真实状态着色，无数据的显示灰色
  const cellMap = {};
  (t.hours || []).forEach((h) => { cellMap[h.h] = h; });
  const p2 = (n) => String(n).padStart(2, '0');
  const now = Date.now();
  const start = new Date(now - 29 * 24 * 3600 * 1000);
  start.setMinutes(0, 0, 0);
  const bars = [];
  for (let ts = start.getTime(); ts <= now; ts += 3600 * 1000) {
    const d = new Date(ts);
    const key = `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:00:00`;
    const h = cellMap[key];
    if (!h) { bars.push('<span class="bar none"></span>'); continue; }
    const title = `${h.h} ${h.ok ? '正常' : '异常'}${h.ms != null ? ' · ' + h.ms + 'ms' : ''}`;
    bars.push(`<span class="bar ${h.ok ? '' : 'down'}" title="${esc(title)}"></span>`);
  }
  let barsHtml = bars.join('');
  const incHtml = (t.incidents && t.incidents.length)
    ? '<ul class="mini-inc">' + t.incidents.map((a) => {
        const icon = a.type === 'check_recovery' ? 'fa-rotate-left' : 'fa-triangle-exclamation';
        const color = a.type === 'check_recovery' ? 'var(--ok)' : (a.type === 'check_down' ? 'var(--down)' : 'var(--warn)');
        return `<li><i class="fa-solid ${icon}" style="color:${color}"></i>${esc(a.title)} · ${fmtTime(a.created_at)}${a.resolved_at ? ' → 持续 ' + dur(a.created_at, a.resolved_at) : ''}</li>`;
      }).join('') + '</ul>'
    : '<div class="mini-inc"><li style="border:none;color:var(--ink-3)">近 30 天无异常事件</li></div>';
  return `
    <div class="detail-grid">
      <div class="dg"><div class="l">近 7 天可用率</div><div class="v">${t.uptime_7d != null ? t.uptime_7d + '%' : '-'}</div></div>
      <div class="dg"><div class="l">近 30 天可用率</div><div class="v">${t.uptime_30d != null ? t.uptime_30d + '%' : '-'}</div></div>
      <div class="dg"><div class="l">近 90 天可用率</div><div class="v">${t.uptime_90d != null ? t.uptime_90d + '%' : '-'}</div></div>
    </div>
    <div class="bars-title">近 30 天状态（每小时一格，绿=正常，红=异常，灰=暂无数据）</div>
    <div class="bars">${barsHtml}</div>
    <div class="bars-x"><span>30 天前</span><span>今天</span></div>
    <div class="bars-title">近期事件</div>
    ${incHtml}`;
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
